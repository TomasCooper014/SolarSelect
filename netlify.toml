[build]
  command = "npm test && node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # LEAD_TOKEN_SECRET only signs thank-you links and never appears in the site;
  # skip it in the secrets scan so a short value cannot fail the build.
  SECRETS_SCAN_OMIT_KEYS = "LEAD_TOKEN_SECRET"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Short domain and www forward to the main address. Add solarstandard.com.au
# as a domain alias in Netlify for these to take effect.
[[redirects]]
  from = "https://solarstandard.com.au/*"
  to = "https://thesolarstandard.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.solarstandard.com.au/*"
  to = "https://thesolarstandard.com.au/:splat"
  status = 301
  force = true
